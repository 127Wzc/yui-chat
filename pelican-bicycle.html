<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鹈鹕骑行日 · SVG 2D 动画</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
        --ink: #26364b;
        --muted: #708096;
        --paper: #fffdf9;
        --accent: #ef7e65;
        --accent-dark: #cf5b51;
        --shadow: 0 24px 70px rgba(41, 65, 89, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, rgba(255, 220, 146, 0.34), transparent 24rem),
          linear-gradient(145deg, #f6f1e8 0%, #e7f2ef 100%);
      }

      .page {
        width: min(1080px, 100%);
      }

      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin: 0 10px 18px;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--accent-dark);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 4vw, 2.35rem);
        letter-spacing: -0.04em;
      }

      .intro p:last-child {
        max-width: 34rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.6;
        text-align: right;
      }

      .stage-card {
        padding: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.56);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .stage {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        background: #bce8f4;
        isolation: isolate;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 13px 6px 2px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .status::before {
        width: 8px;
        height: 8px;
        content: "";
        border-radius: 50%;
        background: #62c58a;
        box-shadow: 0 0 0 5px rgba(98, 197, 138, 0.13);
      }

      button {
        padding: 9px 15px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        background: var(--ink);
        font: inherit;
        font-size: 0.86rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover {
        background: #1a293b;
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 3px solid rgba(239, 126, 101, 0.45);
        outline-offset: 3px;
      }

      /* SVG atmosphere */
      .cloud {
        animation: cloud-drift 19s linear infinite;
        transform-box: view-box;
      }

      .cloud--slow {
        animation-duration: 27s;
        animation-delay: -10s;
      }

      .sun-glow {
        animation: sun-breathe 4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .road-lines {
        animation: road-slide 1.3s linear infinite;
      }

      .wheel-spin {
        animation: wheel-spin 1.55s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .crank-spin {
        animation: wheel-spin 1.55s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .rider-rig {
        animation: rider-bob 1.55s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      .leg--front {
        animation: leg-pump-front 1.55s ease-in-out infinite;
        transform-box: view-box;
        transform-origin: 352px 303px;
      }

      .leg--back {
        animation: leg-pump-back 1.55s ease-in-out infinite;
        transform-box: view-box;
        transform-origin: 334px 307px;
      }

      .wing {
        animation: wing-flap 1.55s ease-in-out infinite;
        transform-box: view-box;
        transform-origin: 319px 257px;
      }

      .scarf-tail {
        animation: scarf-wave 1.55s ease-in-out infinite;
        transform-box: view-box;
        transform-origin: 330px 174px;
      }

      .motion-line {
        animation: motion-fade 1.55s ease-in-out infinite;
      }

      .motion-line--two {
        animation-delay: -0.7s;
      }

      .is-paused * {
        animation-play-state: paused !important;
      }

      @keyframes cloud-drift {
        from { transform: translateX(-90px); }
        to { transform: translateX(110px); }
      }

      @keyframes sun-breathe {
        0%, 100% { opacity: 0.78; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.04); }
      }

      @keyframes road-slide {
        from { transform: translateX(0); }
        to { transform: translateX(-260px); }
      }

      @keyframes wheel-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes rider-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      @keyframes leg-pump-front {
        0%, 100% { transform: rotate(9deg); }
        50% { transform: rotate(-12deg); }
      }

      @keyframes leg-pump-back {
        0%, 100% { transform: rotate(-12deg); }
        50% { transform: rotate(9deg); }
      }

      @keyframes wing-flap {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
      }

      @keyframes scarf-wave {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        50% { transform: rotate(4deg) translateX(-5px); }
      }

      @keyframes motion-fade {
        0%, 100% { opacity: 0.15; transform: translateX(0); }
        50% { opacity: 0.72; transform: translateX(-9px); }
      }

      @media (max-width: 700px) {
        body {
          padding: 14px;
        }

        .intro {
          display: block;
          margin-inline: 4px;
        }

        .intro p:last-child {
          margin-top: 8px;
          text-align: left;
        }

        .stage-card {
          padding: 7px;
          border-radius: 20px;
        }

        .stage {
          border-radius: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div>
          <p class="eyebrow">SVG 2D animation</p>
          <h1>鹈鹕骑行日</h1>
        </div>
        <p>风从长嘴边掠过，车轮沿着海边小路转呀转。</p>

        </div>
        <div class="controls">
          <span id="animationStatus" class="status" aria-live="polite">动画播放中</span>
          <button id="toggleAnimation" type="button" aria-pressed="false">暂停动画</button>
        </div>
      </section>
    </main>

    <script>
      const scene = document.querySelector("#pelicanScene");
      const toggleButton = document.querySelector("#toggleAnimation");
      const status = document.querySelector("#animationStatus");

      toggleButton.addEventListener("click", () => {
        const paused = scene.classList.toggle("is-paused");
        toggleButton.setAttribute("aria-pressed", String(paused));
        toggleButton.textContent = paused ? "继续动画" : "暂停动画";
        status.textContent = paused ? "动画已暂停" : "动画播放中";
      });
    </script>
  </body>
</html>
